analysis: prompt_sensitivity
paired_unit:
  keys:
  - method
  - dataset_id
  variants:
  - P0
  - P1
  - P2
binary_endpoint:
  field: parse_success
  syntax_endpoint: whole_response_turtle
  omnibus: cochran_q_three_complete_variants
  pairwise: mcnemar_valid_pairs_independent_of_omnibus
  multiplicity: holm_within_selected_method_comparisons
  exact_below_discordant: 25
term_endpoint:
  iri_normalization: none_exact_iris
  both_empty_jaccard: 1.0
  no_evaluable_entities: flag_and_exclude_from_stability_inference
  P1_P2_without_P0: supported
  wilcoxon: P0_centred_requires_all_three
  zero_method: pratt
  bootstrap_seed: 42
  bootstrap_resamples: 10000
missingness:
  generation_incomplete: missing
  complete_unparseable: binary_failure_terms_missing
