methods:
  ontogenia:
    display_name: Ontogenia-labelled Memoryless CQ-by-CQ baseline
    system_id: ontogenia
    behavior: one independent generation call per competency question
    implementation: restapi/ontology_adapter.py
    prompt: datasets/ontology_generation/prompts/ontogenia/P0_original.txt

  domain_ontogen:
    display_name: Domain-OntoGen
    system_id: domain-ontogen
    behavior: scenario plus independent competency-question generation
    implementation: restapi/ontology_adapter.py
    prompt: datasets/ontology_generation/prompts/domain-ontogen/P0_original.txt

  neon_gpt:
    display_name: NeOn-GPT
    system_id: neon-gpt
    behavior: staged generation with recorded validation and repair calls
    implementation: restapi/ontology_adapter.py
    prompt: datasets/ontology_generation/prompts/neon-gpt/P0_original.txt
